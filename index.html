<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCNA Flashcards</title>
<style>
  [hidden] {
    display: none !important;
  }
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 16px;
    background: #f4f4f4;
    color: #111;
  }
  .panel {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    border-radius: 10px;
    padding: 16px;
  }
  h1 {
    font-size: 1.3em;
    margin-top: 0;
  }
  label {
    display: block;
    padding: 8px 0;
    font-size: 1.1em;
  }
  input[type="checkbox"] {
    transform: scale(1.4);
    margin-right: 10px;
  }
  input[type="number"] {
    width: 70px;
    font-size: 1.1em;
    padding: 4px;
  }
  button {
    display: block;
    width: 100%;
    font-size: 1.2em;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 8px;
    background: #1a73e8;
    color: #fff;
  }
  .question {
    font-size: 1.2em;
    font-weight: bold;
    white-space: pre-wrap;
  }
  .answer {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #888;
    white-space: pre-wrap;
  }
  .small {
    color: #888;
    font-size: 0.9em;
  }
  #version {
    position: fixed;
    right: 8px;
    bottom: 6px;
  }
  @media (prefers-color-scheme: dark) {
    body {
      background: #1b1b1b;
      color: #eee;
    }
    .panel {
      background: #2a2a2a;
    }
    input[type="number"] {
      background: #333;
      color: #eee;
      border: 1px solid #555;
    }
  }
</style>
</head>
<body>
<div class="panel">

  <!-- Screen 1: pick topics -->
  <div id="setupScreen">
    <h1>CCNA Flashcards</h1>
    <div id="topicList"></div>
    <label>Cards per topic: <input type="number" id="cardsPerTopic" min="1" value="5"></label>
    <button id="startButton">Make deck</button>
  </div>

  <!-- Screen 2: run the deck -->
  <div id="cardScreen" hidden>
    <div class="small" id="progressText"></div>
    <div class="small" id="topicText"></div>
    <p class="question" id="questionText"></p>
    <div class="answer" id="answerText" hidden></div>
    <button id="revealButton">Reveal</button>
    <button id="nextButton" hidden>Next</button>
  </div>

  <!-- Screen 3: deck finished -->
  <div id="doneScreen" hidden>
    <h1>Deck done</h1>
    <button id="newDeckButton">New deck</button>
  </div>

</div>

<!-- Version: bump this when you change anything -->
<div class="small" id="version">v1.0</div>

<script src="logic.js"></script>
<script src="ui.js"></script>
</body>
</html>
